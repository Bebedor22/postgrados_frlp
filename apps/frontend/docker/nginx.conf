# Servidor del frontend ya compilado (expo export -p web).
# Es una SPA: todas las rutas (/wizard/inicio, /tramite/<token>, /conduccion…)
# las resuelve Expo Router en el navegador, así que nginx siempre entrega index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos con un hash en el nombre: cambian de nombre en cada versión, se pueden cachear
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea: así el navegador siempre toma la última versión
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html /index.html;
    }
}