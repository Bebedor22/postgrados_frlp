# Configuración de pytest — correr desde apps/backend:  pytest
[pytest]
testpaths = tests
# La carpeta del backend en el import path, así los tests encuentran `src`, `scripts` y `main`
# (con `python -m pytest` pasaba solo; con el comando `pytest` no)
pythonpath = .
asyncio_mode = auto
# Un solo event loop para toda la corrida: el motor de la base (asyncpg) se crea una
# sola vez y sus conexiones no pueden pasar de un loop a otro
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -ra --strict-markers