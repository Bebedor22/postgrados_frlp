# CI — Sistema de Posgrado (Core)
#
# Corre en cada push y en cada Pull Request. Tres trabajos:
#   1. backend:  tests (pytest) con cobertura mínima del 70 % y migraciones al día
#   2. frontend: chequeo de tipos (TypeScript) y compilación de la versión web
#   3. e2e:      levanta TODO con docker compose (también prueba que las imágenes se
#                construyen) y recorre el flujo principal en un navegador (Playwright)
#
# El resultado se ve en GitHub, en la pestaña "Actions" y con el ✓ o la ✗ al lado de cada commit.

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend · tests y cobertura
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgrado_user
          POSTGRES_PASSWORD: postgrado_dev_password
          POSTGRES_DB: postgrado_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgrado_user -d postgrado_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgrado_user:postgrado_dev_password@localhost:5432/postgrado_dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Las migraciones coinciden con los modelos
        run: |
          alembic upgrade head
          alembic check

      - name: Tests con cobertura (mínimo 70 %)
        run: pytest --cov --cov-report=term --cov-report=html

      - name: Guardar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: apps/backend/htmlcov/

  frontend:
    name: Frontend · tipos y compilación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Compilar la versión web
        run: npx expo export --platform web

  e2e:
    name: E2E · flujo principal con Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el sistema completo (base, backend, frontend y MailHog)
        run: docker compose up -d --build --wait

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Recorrer el flujo principal
        working-directory: e2e
        run: npx playwright test

      - name: Logs de los contenedores (si algo falló)
        if: failure()
        run: docker compose logs

      - name: Guardar el informe de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-e2e
          path: e2e/playwright-report/