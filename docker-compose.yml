# docker-compose.yml — Ambiente de desarrollo Sistema de Posgrado
# Levantar TODO (base, backend, frontend y MailHog):  docker compose up -d --build
# Detener:   docker compose down
# Ver logs:  docker compose logs -f [servicio]
#
# Funciona igual en Windows, macOS y Linux: solo hace falta Docker Desktop.

services:
  # ──────────────────────────────────────────
  # BASE DE DATOS PostgreSQL
  # ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: postgrado-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgrado_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrado_dev_password}
      POSTGRES_DB: ${DB_NAME:-postgrado_dev}
    ports:
      # Si ya tenés un Postgres instalado usando el 5432, poné PUERTO_DB=5433 en el .env
      - "${PUERTO_DB:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgrado_user} -d ${DB_NAME:-postgrado_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # BACKEND API (FastAPI)
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
    container_name: postgrado-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgrado_user}:${DB_PASSWORD:-postgrado_dev_password}@db:5432/${DB_NAME:-postgrado_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      STORAGE_PATH: /var/postgrado-storage
      # smtp = los emails llegan a MailHog (http://localhost:8025); nunca salen a internet
      EMAIL_MODO: ${EMAIL_MODO:-smtp}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      # Necesario en Windows/Mac para que --reload detecte cambios en el volumen
      WATCHFILES_FORCE_POLLING: "true"
      # "si" = con la base vacía, carga los datos de demo al arrancar (usuarios, carreras, aspirantes)
      DATOS_DEMO: ${DATOS_DEMO:-si}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
      - postgrado-storage:/var/postgrado-storage
    # Aplica las migraciones, carga los datos de demo si la base está vacía y levanta la API
    command: sh -c "alembic upgrade head && python -m scripts.seed --automatico && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ──────────────────────────────────────────
  # FRONTEND (Expo web compilado, servido con nginx)
  # http://localhost:8081
  # Para desarrollar con recarga automática:  docker compose stop frontend
  # y después, en apps/frontend:              npx expo start --web
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: postgrado-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

  # ──────────────────────────────────────────
  # MAILHOG — Servidor de email falso para desarrollo
  # Ver emails en: http://localhost:8025
  # ──────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: postgrado-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # UI web para ver emails

volumes:
  pgdata:
    name: postgrado-pgdata
  postgrado-storage:
    name: postgrado-storage

# ──────────────────────────────────────────────────────────────
# INSTRUCCIONES DE USO
#
# Primera vez:
#   docker compose up -d --build
#   Frontend:            http://localhost:8081
#   Swagger del backend: http://localhost:8000/api/docs
#
# Ver emails enviados por el sistema:
#   Abrir http://localhost:8025
#
# Acceder a la base de datos:
#   docker exec -it postgrado-db psql -U postgrado_user -d postgrado_dev
#
# Si algo no funciona:
#   docker compose down && docker compose up -d --build
# ──────────────────────────────────────────────────────────────